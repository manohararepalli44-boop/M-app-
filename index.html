<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Chat</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #fafafa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container { 
            background: white; 
            border: 1px solid #dbdbdb; 
            border-radius: 8px; 
            width: 100%; 
            max-width: 400px; 
            padding: 15px; 
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .call-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .messages-box { 
            height: 280px; 
            overflow-y: auto; 
            border: 1px solid #efefef; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px;
            background: #fdfdfd;
        }
        .messages-box p {
            margin: 5px 0;
            padding: 6px 10px;
            background: #e1f5fe;
            border-radius: 6px;
            width: fit-content;
        }
        form {
            display: flex;
            gap: 5px;
        }
        input[type="text"] { 
            flex: 1;
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        .send-btn { 
            padding: 8px 15px; 
            background-color: #0095f6; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        .back-link { 
            color: #262626; 
            text-decoration: none; 
            font-weight: bold; 
        }
        #call-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            color: white;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <a href="/" class="back-link">← ప్రొఫైల్</a>
        <div class="header-bar">
            <h3>💬 Messenger</h3>
            <!-- Call Button Feature -->
            <button class="call-btn" onclick="startCall()">📞 Call</button>
        </div>
        <hr>
        
        <div class="messages-box">
            {% for msg in messages %}
                <p><b>{{ msg[0] }}:</b> {{ msg[1] }}</p>
            {% else %}
                <p style="color: gray; background: transparent;">మెసేజ్‌లు ఏవీ లేవు...</p>
            {% endfor %}
        </div>

        <form action="/send_message" method="POST">
            <input type="text" name="message_text" placeholder="Type a message..." required autocomplete="off">
            <button type="submit" class="send-btn">Send</button>
        </form>
    </div>

    <!-- Call Overlay Window -->
    <div id="call-container">
        <h2>📞 కాలింగ్...</h2>
        <p>కాల్ కనెక్ట్ అవుతోంది (WebRTC / ZegoCloud Integration)</p>
        <button onclick="endCall()" style="background: red; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">End Call</button>
    </div>

    <script>
        function startCall() {
            document.getElementById('call-container').style.display = 'flex';
        }
        function endCall() {
            document.getElementById('call-container').style.display = 'none';
        }
    </script>
</body>
</html>
